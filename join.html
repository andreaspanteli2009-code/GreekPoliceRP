<header>
  <h1>📝 Αίτηση Ένταξης στην Αστυνομία RP</h1>
</header>

<section class="section">

<form onsubmit="submitForm(event)">

  <h3>👤 Στοιχεία Παίκτη</h3>

  <input type="text" placeholder="RP Name (Όνομα χαρακτήρα)" required>

  <input type="number" placeholder="IRL Ηλικία (πραγματική ηλικία)" required>

  <input type="text" placeholder="Steam Name" required>

  <input type="text" placeholder="Discord Name" required>

  <input type="text" placeholder="Discord ID (π.χ. 123456789)" required>

  <textarea placeholder="Γιατί θέλεις να ενταχθείς στην Ελληνική Αστυνομία RP;" required></textarea>

  <textarea placeholder="Περιέγραψε ένα σενάριο όπου κάνεις έλεγχο σε ύποπτο άτομο" required></textarea>

  <textarea placeholder="Τι σημαίνει για σένα το RP (Roleplay)?" required></textarea>

  <textarea placeholder="Τι θα κάνεις αν ένας ανώτερος σου δώσει παράνομη εντολή στο RP?" required></textarea>

  <textarea placeholder="Ποιος είναι ο ρόλος της Άμεσης Δράσης στο RP;" required></textarea>

  <textarea placeholder="Ποια είναι η διαφορά ΟΠΚΕ και ΔΙ.ΑΣ;" required></textarea>

  <button type="submit">📨 Υποβολή Αίτησης</button>

</form>

</section>
